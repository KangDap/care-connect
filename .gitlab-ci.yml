---
include:
  - project: 'unpad/devops/pipeline'
    ref: v4
    file: '/templates/base-multi-build.gitlab-ci.yml'

variables:
  STAGING_URL: 'https://careconnect.fmipa.stg.unpad.ac.id'
  PRODUCTION_URL: 'https://careconnect.fmipa.unpad.ac.id'

  # Nonaktifkan test job Auto-DevOps (flaky)
  TEST_DISABLED: 'true'

  # Konfigurasi SonarQube: bypass quality gate wait agar tidak memblokir deployment
  SONAR_PROPERTIES: |
    sonar.qualitygate.wait=false
    sonar.exclusions=tests/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,prisma/**,public/**

test:
  rules:
    - when: never
