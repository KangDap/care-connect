apiVersion: v1
kind: ConfigMap
metadata:
  name: ${HELM_RELEASE_NAME}-static
  namespace: ${KUBE_NAMESPACE}
data:
  APP_ENV: ${CI_ENVIRONMENT_NAME}
  APP_URL: ${CI_ENVIRONMENT_URL}
  APP_NAME: 'CareConnect'
  NODE_ENV: 'production'
  SMTP_PORT: '587'
  LOG_CHANNEL: 'sentry'
  SENTRY_TRACES_SAMPLE_RATE: '1.0'
  NEXT_PUBLIC_PAYMENT_ENABLED: 'false'
  PAYMENT_ENABLED: 'false'
  NEXT_PUBLIC_REGISTRATION_ENABLED: 'false'
  # MinIO Object Storage (S3-Compatible Unpad Platform)
  FILESYSTEM_DISK: 's3'
  AWS_URL: 'https://nodes.minio.unpad.dev'
  AWS_ENDPOINT: 'https://nodes.minio.unpad.dev'
  AWS_DEFAULT_REGION: 'id-dipatiukur-1'
  AWS_USE_PATH_STYLE_ENDPOINT: 'true'
