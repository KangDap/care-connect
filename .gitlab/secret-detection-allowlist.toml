[extend]
# Extend GitLab's default rules; keep existing secret checks enabled.
path = "/gitleaks.toml"

[allowlist]
description = "Ignore the dummy credential in the article route test fixture"
regexTarget = "line"
regexes = [
  '''https://user:secret@example\.com/course'''
]
paths = [
  '''tests/routes/article\.route\.test\.ts$'''
]
